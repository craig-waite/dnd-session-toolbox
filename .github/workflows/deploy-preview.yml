name: Deploy (preview)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY_PREVIEW }}

      - name: Deploy to Cloudflare Workers (preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview

      - name: Push runtime secrets to Cloudflare (preview)
        run: |
          echo "${{ secrets.MONGODB_URI_PREVIEW }}" | npx wrangler secret put MONGODB_URI --env preview
          echo "${{ secrets.MONGODB_DB_PREVIEW }}" | npx wrangler secret put MONGODB_DB --env preview
          echo "${{ secrets.CLERK_SECRET_KEY_PREVIEW }}" | npx wrangler secret put CLERK_SECRET_KEY --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
